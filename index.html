<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Аял Exchange — юань и бат</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --hover: #f8fafc;
      --line: #e6ebf2;
      --line-soft: #eef2f7;
      --text: #1e2329;
      --muted: #707a8a;
      --yellow: #c99400;
      --green: #0ecb81;
      --blue: #2563eb;
      --red: #f6465d;
      --radius: 8px;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: "Space Grotesk", sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 70% 40% at 50% -10%, rgba(240, 185, 11, 0.12), transparent 60%),
        var(--bg);
      display: grid;
      place-items: start center;
      padding: 24px 16px calc(96px + env(safe-area-inset-bottom));
      min-height: 100vh;
    }

    main {
      width: min(460px, 100%);
      animation: fade 0.5s var(--ease) both;
    }

    header { margin-bottom: 22px; }

    .brand {
      margin: 0 0 8px;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .lede {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
      font-weight: 500;
    }

    .rates {
      display: grid;
      gap: 10px;
      margin-bottom: 12px;
    }

    .rate {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 16px;
      text-align: center;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .rate:hover {
      background: var(--hover);
      border-color: #d5dde8;
    }

    .rate-code {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .rate-value {
      margin: 0 0 6px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 2.35rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      min-height: 1.1em;
    }

    .rate.cny .rate-value { color: var(--green); }
    .rate.thb .rate-value { color: var(--blue); }

    .rate-unit {
      margin: 0;
      font-size: 0.88rem;
      color: var(--muted);
      font-weight: 500;
    }

    .converter {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
    }

    .converter h2 {
      margin: 0 0 14px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .field { margin-bottom: 14px; }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
    }

    .field-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 2px 8px 2px 14px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      transition: border-color 0.15s ease;
    }

    .field-row:focus-within { border-color: var(--yellow); }

    .field input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 1.2rem;
      font-weight: 600;
      padding: 12px 0;
      font-variant-numeric: tabular-nums;
    }

    .field .suffix {
      flex-shrink: 0;
      padding: 6px 8px;
      border-radius: 4px;
      background: rgba(201, 148, 0, 0.12);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--yellow);
    }

    .results {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .result {
      padding: 12px;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--line-soft);
    }

    .result span {
      display: block;
      margin-bottom: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .result strong {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 1.15rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .result.cny strong { color: var(--green); }
    .result.thb strong { color: var(--blue); }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .live {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 500;
    }

    .pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 0 rgba(14, 203, 129, 0.45);
      animation: pulse 2s ease-out infinite;
    }

    .pulse.err { background: var(--red); animation: none; }

    button.refresh {
      border: 0;
      border-radius: 6px;
      padding: 11px 16px;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      color: #1e2329;
      background: #f0b90b;
      cursor: pointer;
      transition: filter 0.15s ease, opacity 0.15s ease;
    }

    button.refresh:hover { filter: brightness(1.05); }
    button.refresh:disabled { opacity: 0.55; cursor: wait; }

    .status-err {
      width: 100%;
      margin-top: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--red);
    }

    .skeleton {
      display: inline-block;
      min-width: 3.5ch;
      border-radius: 4px;
      background: linear-gradient(90deg, #eef2f7, #e2e8f0, #eef2f7);
      background-size: 200% 100%;
      animation: shimmer 1.1s linear infinite;
      color: transparent !important;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(14, 203, 129, 0.45); }
      70% { box-shadow: 0 0 0 8px rgba(14, 203, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(14, 203, 129, 0); }
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
      background: rgba(245, 247, 250, 0.92);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .dock a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 12px 10px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      transition: filter 0.15s ease, transform 0.15s var(--ease);
    }

    .dock a:hover { filter: brightness(1.03); }
    .dock a:active { transform: scale(0.98); }

    .dock .wa {
      color: #fff;
      background: #25d366;
    }

    .dock .tg {
      color: #fff;
      background: #2aabee;
    }

    .dock svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 class="brand">Аял Exchange</h1>
      <p class="lede">Актуальный обмен юаня и тайского бата к рублю</p>
    </header>

    <section class="rates" aria-label="Текущие курсы">
      <article class="rate cny">
        <div class="rate-code">Юань на Alipay</div>
        <p class="rate-value" id="cnyRub"><span class="skeleton">00.00</span></p>
        <p class="rate-unit">рублей за 1 ¥</p>
      </article>
      <article class="rate thb">
        <div class="rate-code">Бат через банкомат (QR)</div>
        <p class="rate-value" id="thbRub"><span class="skeleton">00.00</span></p>
        <p class="rate-unit">рублей за 1 ฿</p>
      </article>
    </section>

    <section class="converter" aria-label="Калькулятор">
      <h2>Сколько получите</h2>
      <div class="field">
        <label for="amount">Сумма в рублях</label>
        <div class="field-row">
          <input id="amount" type="text" inputmode="decimal" autocomplete="off" value="100 000" />
          <span class="suffix">₽</span>
        </div>
      </div>
      <div class="results">
        <div class="result cny">
          <span>Юани</span>
          <strong id="cnyOut"><span class="skeleton">0.00</span></strong>
        </div>
        <div class="result thb">
          <span>Баты</span>
          <strong id="thbOut"><span class="skeleton">0.00</span></strong>
        </div>
      </div>
    </section>

    <footer>
      <div class="live">
        <span class="pulse" id="pulse" aria-hidden="true"></span>
        <span id="updated">Обновляем курс…</span>
      </div>
      <button type="button" class="refresh" id="refresh">Обновить</button>
    </footer>
    <div class="status-err" id="error" hidden></div>
  </main>

  <nav class="dock" aria-label="Связаться">
    <a class="wa" id="btnWa" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
        <path d="M17.47 14.38c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.95 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.48-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.5h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.08 4.48.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35z"/>
        <path d="M12.04 2C6.5 2 2 6.5 2 12.04c0 1.78.47 3.45 1.28 4.9L2 22l5.2-1.36c1.4.76 3 1.2 4.84 1.2h.01C17.55 21.84 22 17.34 22 11.8 22 6.27 17.55 2 12.04 2zm0 18.15h-.01c-1.6 0-3.1-.43-4.4-1.18l-.31-.19-3.23.85.86-3.15-.2-.32a8.1 8.1 0 01-1.24-4.33c0-4.5 3.66-8.15 8.17-8.15 4.5 0 8.15 3.65 8.15 8.15-.01 4.5-3.66 8.17-8.19 8.17z"/>
      </svg>
      Написать в WhatsApp
    </a>
    <a class="tg" id="btnTg" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
        <path d="M9.78 15.38l-.38 5.32c.54 0 .78-.23 1.06-.5l2.55-2.44 5.29 3.88c.97.54 1.66.26 1.92-.9l3.48-16.37h.01c.31-1.45-.52-2.02-1.47-1.66L1.66 10.1C.25 10.65.27 11.45 1.42 11.8l5.43 1.7L19.1 5.7c.62-.41 1.19-.19.72.22L9.78 15.38z"/>
      </svg>
      Написать в Telegram
    </a>
  </nav>

  <script>
    // Укажите свои контакты:
    const WHATSAPP_PHONE = "79142339428"; // номер без + и пробелов
    const TELEGRAM_USER = "ayalant";

    const $ = (id) => document.getElementById(id);

    let rates = { cny: null, thb: null };

    function fmt(value, digits = 2) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "—";
      return n.toLocaleString("ru-RU", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits,
      });
    }

    function parseAmount(raw) {
      const cleaned = String(raw || "")
        .replace(/\s/g, "")
        .replace(",", ".");
      const n = Number(cleaned);
      return Number.isFinite(n) && n >= 0 ? n : 0;
    }

    function formatAmountInput(n) {
      if (!Number.isFinite(n)) return "";
      return Math.round(n).toLocaleString("ru-RU");
    }

    function renderOut() {
      const rub = parseAmount($("amount").value);
      if (Number.isFinite(rates.cny) && rates.cny > 0) {
        $("cnyOut").textContent = fmt(rub / rates.cny, 2) + " ¥";
      }
      if (Number.isFinite(rates.thb) && rates.thb > 0) {
        $("thbOut").textContent = fmt(rub / rates.thb, 2) + " ฿";
      }
      updateContactLinks(rub);
    }

    function updateContactLinks(rub) {
      const sum = Number.isFinite(rub) ? fmt(rub, 0) : "100 000";
      const text = encodeURIComponent(
        "Здравствуйте! Аял Exchange — хочу обмен на " + sum + " ₽"
      );
      $("btnWa").href =
        "https://wa.me/" + WHATSAPP_PHONE + "?text=" + text;
      $("btnTg").href = "https://t.me/" + TELEGRAM_USER;
    }

    async function loadRate() {
      $("refresh").disabled = true;
      $("error").hidden = true;
      $("pulse").classList.remove("err");

      try {
        const res = await fetch("/api/prices", { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Нет данных");

        rates.cny = Number(data.cny_rub);
        rates.thb = Number(data.thb_rub);

        $("cnyRub").textContent = fmt(rates.cny, 2);
        $("thbRub").textContent = fmt(rates.thb, 2);
        renderOut();

        $("updated").textContent =
          "Обновлено " +
          new Date().toLocaleTimeString("ru-RU", {
            hour: "2-digit",
            minute: "2-digit",
          });
      } catch {
        $("pulse").classList.add("err");
        $("updated").textContent = "Нет связи с курсом";
        $("error").hidden = false;
        $("error").textContent = "Попробуйте обновить чуть позже";
      } finally {
        $("refresh").disabled = false;
      }
    }

    const amount = $("amount");
    amount.addEventListener("input", renderOut);
    amount.addEventListener("blur", () => {
      const n = parseAmount(amount.value);
      amount.value = formatAmountInput(n || 100000);
      renderOut();
    });

    $("refresh").addEventListener("click", loadRate);
    updateContactLinks(parseAmount($("amount").value));
    loadRate();
    setInterval(loadRate, 30000);
  </script>
</body>
</html>
